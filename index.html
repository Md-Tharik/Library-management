<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management Interface</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --background-color: #f4f7f6;
            --border-color: #ddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1, h2 {
            color: var(--primary-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .panel {
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .form-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        input, select, button {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
        }

        input { flex: 1; min-width: 150px; }

        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }

        button:hover { background-color: #2980b9; }
        button.danger { background-color: var(--danger-color); }
        button.danger:hover { background-color: #c0392b; }
        button.success { background-color: var(--success-color); }
        button.success:hover { background-color: #27ae60; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--primary-color);
            color: white;
        }

        tr:hover { background-color: #f1f1f1; }

        .actions button {
            padding: 5px 10px;
            margin-right: 5px;
            font-size: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Library Management Interface</h1>

    <!-- Add / Edit Book Section -->
    <div class="panel">
        <h2 id="formTitle">Add New Book</h2>
        <form id="bookForm">
            <input type="hidden" id="bookId">
            <div class="form-group">
                <input type="text" id="title" placeholder="Book Title" required>
                <input type="text" id="author" placeholder="Author" required>
                <input type="text" id="isbn" placeholder="ISBN" required>
            </div>
            <div class="form-group">
                <input type="text" id="category" placeholder="Category" required>
                <input type="number" id="quantity" placeholder="Total Quantity" min="1" required>
                <button type="submit" id="saveBtn">Save Book</button>
                <button type="button" id="cancelEditBtn" style="display:none;" onclick="resetBookForm()">Cancel</button>
            </div>
        </form>
    </div>

    <!-- Search & Filter Section -->
    <div class="panel">
        <h2>Search & Filter</h2>
        <div class="form-group">
            <input type="text" id="searchInput" placeholder="Search by Title, Author, or ISBN..." onkeyup="renderBooks()">
            <select id="filterCategory" onchange="renderBooks()">
                <option value="">All Categories</option>
            </select>
            <select id="filterAvailability" onchange="renderBooks()">
                <option value="">All Status</option>
                <option value="available">Available</option>
                <option value="unavailable">Out of Stock</option>
            </select>
        </div>
    </div>

    <!-- Book Catalogue Section -->
    <div class="panel">
        <h2>Book Catalogue</h2>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>ISBN</th>
                        <th>Category</th>
                        <th>Total Qty</th>
                        <th>Available</th>
                        <th>Issued</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="booksTableBody">
                    <!-- Books will be injected here via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Issued Books Section -->
    <div class="panel">
        <h2>Issued Books Records</h2>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Book Title</th>
                        <th>Borrower Name</th>
                        <th>Issue Date</th>
                        <th>Due Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="issuesTableBody">
                    <!-- Issue records will be injected here via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Issue Book Modal -->
<div class="modal" id="issueModal">
    <div class="modal-content">
        <h2>Issue Book</h2>
        <p><strong>Book:</strong> <span id="issueBookTitleDisplay"></span></p>
        <form id="issueForm">
            <input type="hidden" id="issueBookId">
            <div class="form-group">
                <input type="text" id="borrowerName" placeholder="Borrower Name" required style="width: 100%;">
            </div>
            <div class="form-group">
                <label style="width: 100%;">Issue Date:<br>
                    <input type="date" id="issueDate" required style="width: 100%;">
                </label>
            </div>
            <div class="form-group">
                <label style="width: 100%;">Due Date:<br>
                    <input type="date" id="dueDate" required style="width: 100%;">
                </label>
            </div>
            <div class="form-group">
                <button type="submit" class="success">Confirm Issue</button>
                <button type="button" class="danger" onclick="closeIssueModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
    // --- Data Management (Local Storage) ---
    let books = JSON.parse(localStorage.getItem('library_books')) || [];
    let issues = JSON.parse(localStorage.getItem('library_issues')) || [];

    function saveData() {
        localStorage.setItem('library_books', JSON.stringify(books));
        localStorage.setItem('library_issues', JSON.stringify(issues));
    }

    // --- Book Management ---
    const bookForm = document.getElementById('bookForm');
    
    bookForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const id = document.getElementById('bookId').value;
        const title = document.getElementById('title').value.trim();
        const author = document.getElementById('author').value.trim();
        const isbn = document.getElementById('isbn').value.trim();
        const category = document.getElementById('category').value.trim();
        const totalQty = parseInt(document.getElementById('quantity').value);

        if (id) {
            // Edit existing book
            const bookIndex = books.findIndex(b => b.id == id);
            const book = books[bookIndex];
            
            // Adjust available quantity based on new total
            const qtyDifference = totalQty - book.totalQty;
            book.totalQty = totalQty;
            book.availableQty += qtyDifference;
            
            book.title = title;
            book.author = author;
            book.isbn = isbn;
            book.category = category;
            
        } else {
            // Add new book
            // Check for duplicate ISBN
            if (books.some(b => b.isbn === isbn)) {
                alert('A book with this ISBN already exists!');
                return;
            }

            const newBook = {
                id: Date.now().toString(),
                title,
                author,
                isbn,
                category,
                totalQty,
                availableQty: totalQty,
                issuedQty: 0
            };
            books.push(newBook);
        }

        saveData();
        resetBookForm();
        renderBooks();
        updateCategoryFilter();
    });

    function editBook(id) {
        const book = books.find(b => b.id === id);
        if (!book) return;

        document.getElementById('bookId').value = book.id;
        document.getElementById('title').value = book.title;
        document.getElementById('author').value = book.author;
        document.getElementById('isbn').value = book.isbn;
        document.getElementById('category').value = book.category;
        document.getElementById('quantity').value = book.totalQty;
        
        document.getElementById('formTitle').innerText = 'Edit Book';
        document.getElementById('cancelEditBtn').style.display = 'inline-block';
        window.scrollTo(0,0);
    }

    function deleteBook(id) {
        if(confirm('Are you sure you want to delete this book?')) {
            const book = books.find(b => b.id === id);
            if(book.issuedQty > 0) {
                alert('Cannot delete this book. Copies are currently issued.');
                return;
            }
            books = books.filter(b => b.id !== id);
            saveData();
            renderBooks();
            updateCategoryFilter();
        }
    }

    function resetBookForm() {
        bookForm.reset();
        document.getElementById('bookId').value = '';
        document.getElementById('formTitle').innerText = 'Add New Book';
        document.getElementById('cancelEditBtn').style.display = 'none';
    }

    // --- Book Issuing and Returning ---
    const issueModal = document.getElementById('issueModal');
    const issueForm = document.getElementById('issueForm');

    function openIssueModal(bookId) {
        const book = books.find(b => b.id === bookId);
        if (book.availableQty <= 0) {
            alert('No copies available for issue.');
            return;
        }

        document.getElementById('issueBookId').value = book.id;
        document.getElementById('issueBookTitleDisplay').innerText = book.title;
        
        // Default dates
        const today = new Date().toISOString().split('T')[0];
        let nextWeek = new Date();
        nextWeek.setDate(nextWeek.getDate() + 7);
        const due = nextWeek.toISOString().split('T')[0];
        
        document.getElementById('issueDate').value = today;
        document.getElementById('dueDate').value = due;

        issueModal.style.display = 'flex';
    }

    function closeIssueModal() {
        issueModal.style.display = 'none';
        issueForm.reset();
    }

    issueForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const bookId = document.getElementById('issueBookId').value;
        const borrowerName = document.getElementById('borrowerName').value.trim();
        const issueDate = document.getElementById('issueDate').value;
        const dueDate = document.getElementById('dueDate').value;

        const book = books.find(b => b.id === bookId);
        
        if (book.availableQty > 0) {
            // Update Book Quantities
            book.availableQty -= 1;
            book.issuedQty += 1;

            // Record Issue
            const newIssue = {
                id: Date.now().toString(),
                bookId: book.id,
                bookTitle: book.title,
                borrowerName,
                issueDate,
                dueDate,
                returned: false
            };
            issues.push(newIssue);

            saveData();
            closeIssueModal();
            renderBooks();
            renderIssues();
        } else {
            alert("Sorry, no copies are available.");
        }
    });

    function returnBook(issueId) {
        if(confirm('Confirm return of this book?')) {
            const issueRecord = issues.find(i => i.id === issueId);
            if (!issueRecord || issueRecord.returned) return;

            const book = books.find(b => b.id === issueRecord.bookId);
            if(book) {
                book.availableQty += 1;
                book.issuedQty -= 1;
            }

            issueRecord.returned = true;
            
            saveData();
            renderBooks();
            renderIssues();
        }
    }

    // --- Rendering and Filtering ---
    function renderBooks() {
        const tbody = document.getElementById('booksTableBody');
        tbody.innerHTML = '';

        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const categoryFilter = document.getElementById('filterCategory').value;
        const availabilityFilter = document.getElementById('filterAvailability').value;

        const filteredBooks = books.filter(book => {
            const matchesSearch = book.title.toLowerCase().includes(searchTerm) || 
                                  book.author.toLowerCase().includes(searchTerm) || 
                                  book.isbn.includes(searchTerm);
            const matchesCategory = categoryFilter === '' || book.category === categoryFilter;
            
            let matchesAvailability = true;
            if (availabilityFilter === 'available') matchesAvailability = book.availableQty > 0;
            if (availabilityFilter === 'unavailable') matchesAvailability = book.availableQty === 0;

            return matchesSearch && matchesCategory && matchesAvailability;
        });

        filteredBooks.forEach(book => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${book.title}</td>
                <td>${book.author}</td>
                <td>${book.isbn}</td>
                <td>${book.category}</td>
                <td>${book.totalQty}</td>
                <td><strong>${book.availableQty}</strong></td>
                <td>${book.issuedQty}</td>
                <td class="actions">
                    <button onclick="editBook('${book.id}')">Edit</button>
                    <button class="danger" onclick="deleteBook('${book.id}')">Delete</button>
                    <button class="success" onclick="openIssueModal('${book.id}')" ${book.availableQty <= 0 ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>Issue</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function renderIssues() {
        const tbody = document.getElementById('issuesTableBody');
        tbody.innerHTML = '';

        // Sort to show active issues first
        const sortedIssues = [...issues].sort((a, b) => (a.returned === b.returned) ? 0 : a.returned ? 1 : -1);

        sortedIssues.forEach(issue => {
            const statusStr = issue.returned ? '<span style="color:gray;">Returned</span>' : '<span style="color:var(--danger-color); font-weight:bold;">Issued</span>';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${issue.bookTitle}</td>
                <td>${issue.borrowerName}</td>
                <td>${issue.issueDate}</td>
                <td>${issue.dueDate}</td>
                <td>${statusStr}</td>
                <td>
                    ${!issue.returned ? `<button class="success" onclick="returnBook('${issue.id}')">Process Return</button>` : '-'}
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function updateCategoryFilter() {
        const filterCategory = document.getElementById('filterCategory');
        const currentVal = filterCategory.value;
        
        // Get unique categories
        const categories = [...new Set(books.map(b => b.category))];
        
        filterCategory.innerHTML = '<option value="">All Categories</option>';
        categories.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat;
            option.innerText = cat;
            filterCategory.appendChild(option);
        });
        
        filterCategory.value = currentVal; // preserve selection if possible
    }

    // --- Initialization ---
    updateCategoryFilter();
    renderBooks();
    renderIssues();

</script>
</body>
</html>
